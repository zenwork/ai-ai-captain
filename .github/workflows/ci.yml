name: CI

# CI runs once for each pull request. The branch rules of `main` require an up-to-date branch,
# so the tested result is the result that lands on `main`. A run on the push to `main` would repeat the test.
on:
  pull_request:
    branches: [main]

# A new push to the same pull request replaces the run that is still active.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # The release pull request changes only the version and the changelog. The code is already tested.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  validate:
    needs: quality
    # The release pull request changes only the version and the changelog. The code is already tested.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install xdotool and xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xdotool xvfb
      - run: npm ci
      - run: npm run typecheck
      - name: Test (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run build

  # The scenarios start the real hub and mock agent processes. The mock agents work on Linux and macOS only.
  # The browser for the virtual deck runs headless, so no display is necessary.
  e2e:
    needs: quality
    # The release pull request changes only the version and the changelog. The code is already tested.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end tests
        env:
          # A failed scenario keeps a recording of its steps in the temporary folder. The next step uploads it.
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          npm run test:e2e
      - name: Save the recordings of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-recordings-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e/**/*.recording.json
          if-no-files-found: ignore
