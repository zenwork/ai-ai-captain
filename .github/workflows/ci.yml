name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install xdotool and xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xdotool xvfb
      - run: npm ci
      - run: npm run typecheck
      - name: Test (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run build
