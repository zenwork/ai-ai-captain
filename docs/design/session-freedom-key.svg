<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="540" viewBox="0 0 1230 540" role="img" aria-labelledby="t d">
<title id="t">AI AI Captain: freedom and auto indicators on info key C</title>
<desc id="d">Proposal. Layout C of the session info key with two indicators. A padlock shows the sandbox freedom: closed is limited, open is full, dashed is not reported. A double chevron labeled AUTO shows that the session never asks for decisions. Fjord palette.</desc>
<rect width="1230" height="540" fill="#0E1621"/><g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="30" fill="#A0B2C4" font-size="11" font-weight="700" letter-spacing="2">AI AI CAPTAIN / DESIGN PROPOSAL / FJORD</text>
<text x="36" y="68" fill="#F2F6FA" font-size="30" font-weight="700">Info key C with two indicators</text>
<text x="36" y="94" fill="#A0B2C4" font-size="13">Proposed, not implemented. Both indicators sit in the lower row of the info key. Drawn at 1.5× scale.</text>
<text x="36" y="116" fill="#F2F6FA" font-size="13">Padlock + LIMIT or FULL: where the session can write. Double chevron + AUTO: the session never asks. Dashed + ?: not reported.</text>
<g transform="translate(36 160) scale(1.5)"><rect width="72" height="72" rx="8" fill="#102D2C" stroke="#79C4B5" stroke-width="1.5"/><text x="36" y="26" fill="#F2F6FA" font-size="11" font-weight="700" text-anchor="middle">CODEX</text><rect x="6" y="48" width="60" height="18" rx="4" fill="#79C4B5"/><text x="36" y="61" fill="#111827" font-size="10" font-weight="700" text-anchor="middle">WORKING</text></g>
