<text x="36" y="470" fill="#A0B2C4" font-size="13">Padlock = sandbox (where it can write). AUTO = approval (never asks). Codex sets both separately, so all four combinations can occur.</text>
<text x="36" y="492" fill="#A0B2C4" font-size="13">AUTO uses the warning color. The symbol and the label carry the meaning too. Hosts that do not report a value show a dashed shape and "?".</text>
</g></svg>
