<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="700" viewBox="0 0 1840 700" font-family="Arial, Helvetica, sans-serif"><title>How to read a session key and an info key</title>
<rect width="1840" height="700" fill="#0E1621"/>
<text x="920" y="48" fill="#F2F6FA" font-size="28" font-weight="700" text-anchor="middle">How to read a session key and an info key</text>
<text x="484" y="100" fill="#79C4B5" font-size="20" font-weight="700" text-anchor="middle">SESSION KEY</text>
<text x="1404" y="100" fill="#79C4B5" font-size="20" font-weight="700" text-anchor="middle">INFO KEY (below the session key)</text>
<line x1="920" y1="80" x2="920" y2="550" stroke="#43546A" stroke-width="1.5"/><svg xmlns="http://www.w3.org/2000/svg" x="340" y="150" width="288" height="288" viewBox="0 0 72 72"><title>Codex CLI: WORKING</title><g font-family="Arial, Helvetica, sans-serif"><g aria-label="CODEX, CLI: WORKING, Turn in progress, Fjord">
