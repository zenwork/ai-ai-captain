<rect x="3" y="51" width="66" height="18" rx="4" fill="#79C4B5"/>
<g color="#111827"><g transform="translate(7 53.5) scale(0.5833333333333334)"><g fill="none" stroke="#111827" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></g></g></g>
<text x="0" y="64.1" fill="#111827" font-size="11" transform="translate(45.5 0) scale(.8 1)" text-anchor="middle" font-weight="800" letter-spacing=".1">WORKING</text>
</g></g></svg><svg xmlns="http://www.w3.org/2000/svg" x="1260" y="150" width="288" height="288" viewBox="0 0 72 72"><title>Refactor auth: gpt-5.5, 88K tokens, context 44 percent, full freedom, never asks</title><g font-family="Arial, Helvetica, sans-serif"><g aria-label="gpt-5.5, 88K tokens, context 44 percent, full freedom, never asks">
<rect width="72" height="72" rx="8" fill="#0E1621" stroke="#43546A" stroke-width="1.5"/>
<text x="6" y="15" fill="#A0B2C4" font-size="10" >gpt-5.5</text>
<text x="66" y="15" fill="#F2F6FA" font-size="10" text-anchor="end">88K</text>
<rect x="6" y="22" width="60" height="18" rx="4" fill="none" stroke="#43546A" stroke-width="1.5"/><rect x="7.5" y="23.5" width="25.08" height="15" rx="3" fill="#79C4B5"/>
<line x1="52.5" y1="21" x2="52.5" y2="41" stroke="#A0B2C4" stroke-width="1"/>
<g transform="translate(8 45) scale(1.4)"><path d="M1,1 L6,7.5 L1,14 M7,1 L12,7.5 L7,14" fill="none" stroke="#79C4B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(44 44) scale(1.4)"><path d="M2,6 V4 a4,4 0 0 1 8,0" fill="none" stroke="#79C4B5" stroke-width="1.8"/><rect x="0" y="6" width="12" height="9" rx="2" fill="#79C4B5" stroke="#79C4B5" stroke-width="1.5"/></g>
</g></g></svg><polyline points="388,194 300,170" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="388" cy="194" r="4" fill="#E3C291"/><circle cx="300" cy="170" r="13" fill="#E3C291"/><text x="300" y="175" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="276" y="168" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="end">Key number</text><text x="276" y="186" fill="#A0B2C4" font-size="13" text-anchor="end">Position of the session</text><polyline points="468,274 300,270" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="468" cy="274" r="4" fill="#E3C291"/><circle cx="300" cy="270" r="13" fill="#E3C291"/><text x="300" y="275" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="276" y="268" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="end">Assistant symbol</text><text x="276" y="286" fill="#A0B2C4" font-size="13" text-anchor="end">Shows which tool runs it</text><polyline points="396,390 300,370" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="396" cy="390" r="4" fill="#E3C291"/><circle cx="300" cy="370" r="13" fill="#E3C291"/><text x="300" y="375" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="276" y="368" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="end">State symbol</text><text x="276" y="386" fill="#A0B2C4" font-size="13" text-anchor="end">Matches the state label</text><polyline points="572,194 668,170" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="572" cy="194" r="4" fill="#E3C291"/><circle cx="668" cy="170" r="13" fill="#E3C291"/><text x="668" y="175" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="692" y="168" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="start">App badge</text><text x="692" y="186" fill="#A0B2C4" font-size="13" text-anchor="start">Terminal, IDE, or desktop app</text><polyline points="624,294 668,270" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="624" cy="294" r="4" fill="#E3C291"/><circle cx="668" cy="270" r="13" fill="#E3C291"/><text x="668" y="275" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="692" y="268" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="start">Border color</text><text x="692" y="286" fill="#A0B2C4" font-size="13" text-anchor="start">Follows the state</text><polyline points="520,390 668,370" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="520" cy="390" r="4" fill="#E3C291"/><circle cx="668" cy="370" r="13" fill="#E3C291"/><text x="668" y="375" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="692" y="368" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="start">State label</text><text x="692" y="386" fill="#A0B2C4" font-size="13" text-anchor="start">WORKING, WAITING, DONE, ...</text><polyline points="1316,194 1220,170" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="1316" cy="194" r="4" fill="#E3C291"/><circle cx="1220" cy="170" r="13" fill="#E3C291"/><text x="1220" y="175" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="1196" y="168" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="end">Model</text><text x="1196" y="186" fill="#A0B2C4" font-size="13" text-anchor="end">Short name of the model</text><polyline points="1340,274 1220,270" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="1340" cy="274" r="4" fill="#E3C291"/><circle cx="1220" cy="270" r="13" fill="#E3C291"/><text x="1220" y="275" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="1196" y="268" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="end">Context bar</text><text x="1196" y="286" fill="#A0B2C4" font-size="13" text-anchor="end">Share of the context window used</text><polyline points="1328,372 1220,370" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="1328" cy="372" r="4" fill="#E3C291"/><circle cx="1220" cy="370" r="13" fill="#E3C291"/><text x="1220" y="375" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="1196" y="368" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="end">AUTO symbol</text><text x="1196" y="386" fill="#A0B2C4" font-size="13" text-anchor="end">Green chevrons: it never asks you</text><polyline points="1500,194 1588,170" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="1500" cy="194" r="4" fill="#E3C291"/><circle cx="1588" cy="170" r="13" fill="#E3C291"/><text x="1588" y="175" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="1612" y="168" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="start">Tokens used</text><text x="1612" y="186" fill="#A0B2C4" font-size="13" text-anchor="start">Tokens in the context</text><polyline points="1470,238 1588,270" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="1470" cy="238" r="4" fill="#E3C291"/><circle cx="1588" cy="270" r="13" fill="#E3C291"/><text x="1588" y="275" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="1612" y="268" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="start">80% mark</text><text x="1612" y="286" fill="#A0B2C4" font-size="13" text-anchor="start">The bar turns amber above it</text><polyline points="1468,372 1588,370" fill="none" stroke="#E3C291" stroke-width="1.5"/><circle cx="1468" cy="372" r="4" fill="#E3C291"/><circle cx="1588" cy="370" r="13" fill="#E3C291"/><text x="1588" y="375" fill="#111827" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="1612" y="368" fill="#F2F6FA" font-size="15" font-weight="700" text-anchor="start">Freedom symbol</text><text x="1612" y="386" fill="#A0B2C4" font-size="13" text-anchor="start">Padlock: green full, amber limited</text><rect x="40" y="570" width="1760" height="100" rx="10" fill="none" stroke="#43546A" stroke-width="1.5"/>
<text x="64" y="602" fill="#F2F6FA" font-size="15" font-weight="700">Unknown data</text>
<text x="64" y="628" fill="#A0B2C4" font-size="14">A dashed outline, a dashed symbol, or "?" means that the host does not report the value.</text>
<text x="64" y="652" fill="#A0B2C4" font-size="14">No AUTO symbol means that the session asks before it acts. Each state has a symbol and a label, not only a color.</text>
</svg>