<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="1240" height="770" role="img" aria-label="AI AI Captain architecture. Local harness files and reporters feed the hub. The SessionStore is the single source for the Stream Deck plugin, the web dashboard, and the virtual deck. Key presses go back through the focus adapter of the hub to the host apps." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AI AI Captain architecture</title>
  <style>
    .bx{fill:#ffffff;stroke:#b9bec4;stroke-width:1}
    .hubbx{fill:#f5f6f7;stroke:#3d5a80;stroke-width:1.5}
    .key{fill:#edf1f6;stroke:#3d5a80;stroke-width:1.5}
    .dash{fill:none;stroke:#b9bec4;stroke-dasharray:4 4}
    .t{font:600 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .tl{font:600 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d5a80}
    .m{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5f6670}
    .s{font:400 11.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .n{font:italic 400 11px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#5f6670}
    .h{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:#5f6670}
    .ar{fill:none;stroke:#1f2328;stroke-width:1.3}
    .arA{fill:none;stroke:#3d5a80;stroke-width:1.6}
    .ard{fill:none;stroke:#3d5a80;stroke-width:1.3;stroke-dasharray:5 4}
    .halo{fill:none;stroke:#f5f6f7;stroke-width:7}
    .lab{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328}
    .labA{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3d5a80}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="770" fill="#ffffff"/>

  <!-- The plugin supervises the hub process -->
  <path class="ard" d="M1060,110 V36 H600 V62" marker-end="url(#ahA)"/>
  <text class="labA" x="830" y="28" text-anchor="middle">supervises: /health check · spawns bin/hub.cjs · restarts 1→30 s</text>

  <!-- Local evidence -->
  <text class="h" x="20" y="82">LOCAL EVIDENCE · READ-ONLY</text>
  <rect class="bx" x="20" y="96"  width="250" height="52" rx="4"/><text class="t" x="32" y="117">GitHub Copilot</text><text class="m" x="32" y="136">~/.copilot  hold locks · events.jsonl</text>
  <rect class="bx" x="20" y="158" width="250" height="52" rx="4"/><text class="t" x="32" y="179">Codex (CLI · IDE · ChatGPT app)</text><text class="m" x="32" y="198">~/.codex  locks · rollout-*.jsonl</text>
  <rect class="bx" x="20" y="220" width="250" height="52" rx="4"/><text class="t" x="32" y="241">Claude Code (CLI · IDE)</text><text class="m" x="32" y="260">~/.claude  sessions/&lt;pid&gt;.json</text>
  <rect class="bx" x="20" y="282" width="250" height="52" rx="4"/><text class="t" x="32" y="303">Junie (IntelliJ IDEA)</text><text class="m" x="32" y="322">~/.junie  index.jsonl · events</text>
  <rect class="bx" x="20" y="344" width="250" height="52" rx="4"/><text class="t" x="32" y="365">Claude desktop <tspan class="n">experimental</tspan></text><text class="m" x="32" y="384">Accessibility tree · chat IDs only</text>
  <rect class="bx" x="20" y="406" width="250" height="52" rx="4"/><text class="t" x="32" y="427">OS process table</text><text class="m" x="32" y="446">ps · lsof · /proc · PowerShell</text>

  <text class="h" x="20" y="500">PUSH REPORTERS</text>
  <rect class="bx" x="20" y="514" width="250" height="52" rx="4"/><text class="t" x="32" y="535">CLI reporter &amp; hooks</text><text class="m" x="32" y="554">src/cli.ts · npm run report</text>
  <rect class="bx" x="20" y="576" width="250" height="52" rx="4"/><text class="t" x="32" y="597">Other harnesses</text><text class="m" x="32" y="616">any local client · HTTP</text>

  <path class="ar" d="M270,122 H302 M270,184 H302 M270,246 H302 M270,308 H302 M270,370 H302 M270,432 H302 M302,122 V432"/>
  <path class="ar" d="M302,220 H358" marker-end="url(#ah)"/>
  <text class="lab" transform="translate(296 340) rotate(-90)" text-anchor="middle">reads transiently</text>

  <!-- Hub -->
  <rect class="hubbx" x="330" y="64" width="530" height="680" rx="8"/>
  <text class="tl" x="350" y="90">Hub</text>
  <text class="m" x="384" y="90">Node + Fastify · 127.0.0.1:43681 · src/server/</text>

  <rect class="bx" x="360" y="110" width="230" height="220" rx="4"/>
  <text class="t" x="374" y="132">Automatic adapters</text>
  <text class="m" x="374" y="150">discovery.ts · scan every 1.5 s</text>
  <text class="s" x="374" y="178">copilot.ts</text>
  <text class="s" x="374" y="198">codex.ts · events.ts (JSONL cursor)</text>
  <text class="s" x="374" y="218">claude.ts</text>
  <text class="s" x="374" y="238">junie.ts</text>
  <text class="s" x="374" y="258">claude-desktop.ts</text>
  <text class="n" x="374" y="306">drops prompts, replies, tool data</text>

  <rect class="bx" x="610" y="110" width="230" height="220" rx="4"/>
  <text class="t" x="624" y="132">Host-lifetime gate</text>
  <text class="m" x="624" y="150">processes.ts · lifetimes.ts</text>
  <text class="s" x="624" y="178">live ownership (open files)</text>
  <text class="s" x="624" y="198">host-app ancestry</text>
  <text class="s" x="624" y="218">revoked terminals</text>
  <text class="s" x="624" y="238">JetBrains project registry</text>
  <text class="n" x="624" y="306">suppresses stale history</text>
  <path class="ar" d="M610,220 H592" marker-end="url(#ah)"/>

  <rect class="key" x="360" y="370" width="230" height="100" rx="4"/>
  <text class="t" x="374" y="392">SessionStore</text>
  <text class="m" x="374" y="410">store.ts</text>
  <text class="s" x="374" y="432">canonical session inventory</text>
  <text class="s" x="374" y="452">hidden until confirmed live</text>

  <rect class="bx" x="610" y="370" width="110" height="100" rx="4"/>
  <text class="t" x="622" y="392">Clients</text>
  <text class="m" x="622" y="410">clients.ts</text>
  <text class="s" x="622" y="432">app presence</text>
  <text class="s" x="622" y="452">no session keys</text>

  <rect class="bx" x="730" y="370" width="110" height="100" rx="4"/>
  <text class="t" x="742" y="392">Settings</text>
  <text class="m" x="742" y="410">settings.ts</text>
  <text class="s" x="742" y="432">icon palette</text>
  <text class="s" x="742" y="452">flash level 0–4</text>

  <path class="arA" d="M475,330 V368" marker-end="url(#ahA)"/>
  <text class="labA" x="483" y="354">SessionInput</text>
  <path class="ar" d="M665,330 V368" marker-end="url(#ah)"/>
  <text class="lab" x="672" y="354">app presence</text>

  <rect class="bx" x="360" y="510" width="480" height="80" rx="4"/>
  <text class="t" x="374" y="532">HTTP API + SSE <tspan class="m">app.ts</tspan></text>
  <text class="m" x="374" y="554">GET /api/sessions · PUT /api/sessions/:id · POST …/focus</text>
  <text class="m" x="374" y="574">GET /api/events (SSE, 15 s heartbeat) · /health · static web/</text>

  <path class="arA" d="M475,470 V508" marker-end="url(#ahA)"/>
  <text class="labA" x="483" y="494">upsert / remove</text>
  <path class="ar" d="M665,470 V508" marker-end="url(#ah)"/>
  <path class="ar" d="M785,470 V508" marker-end="url(#ah)"/>

  <rect class="bx" x="360" y="630" width="230" height="94" rx="4"/>
  <text class="t" x="374" y="652">Data directory</text>
  <text class="m" x="374" y="670">~/Library/Application Support/</text>
  <text class="m" x="374" y="688">sessions.json · settings.json</text>
  <text class="m" x="374" y="706">host-lifetimes.json · 0600</text>
  <path class="ar" d="M360,440 H346 V675 H358" marker-end="url(#ah)"/>
  <text class="lab" transform="translate(340 600) rotate(-90)" text-anchor="middle">persists atomically</text>

  <rect class="bx" x="610" y="630" width="230" height="94" rx="4"/>
  <text class="t" x="624" y="652">Focus adapter</text>
  <text class="m" x="624" y="670">focus.ts · dashboard.ts</text>
  <text class="s" x="624" y="690">osascript · xdotool · PowerShell</text>
  <text class="s" x="624" y="710">validated, bounded commands</text>
  <path class="ar" d="M725,590 V628" marker-end="url(#ah)"/>
  <text class="lab" x="732" y="614">focus request</text>

  <path class="ar" d="M270,540 H302 M270,602 H302 M302,540 V602"/>
  <path class="halo" d="M332,560 H356"/>
  <path class="ar" d="M302,560 H358" marker-end="url(#ah)"/>
  <text class="lab" transform="translate(296 652) rotate(-90)" text-anchor="middle">PUT /api/sessions</text>

  <!-- Consumers -->
  <text class="h" x="900" y="82">CONSUMERS · SAME SNAPSHOT</text>
  <rect class="bx" x="900" y="110" width="320" height="150" rx="4"/>
  <text class="t" x="914" y="132">Stream Deck plugin</text>
  <text class="m" x="914" y="150">streamdeck/src/plugin.ts · Node 20</text>
  <text class="s" x="914" y="174">polls GET /api/sessions every 1.5 s</text>
  <text class="s" x="914" y="194">key layout, paging, attention flash</text>
  <text class="s" x="914" y="214">key press → POST …/focus</text>
  <text class="m" x="914" y="242">hub-supervisor.ts keeps the hub alive ↑</text>

  <rect class="bx" x="900" y="290" width="320" height="80" rx="4"/>
  <text class="t" x="914" y="312">Web dashboard</text>
  <text class="m" x="914" y="330">web/index.html · web-src/main.ts</text>
  <text class="s" x="914" y="352">live via SSE · settings · diagnostics</text>

  <rect class="bx" x="900" y="390" width="320" height="80" rx="4"/>
  <text class="t" x="914" y="412">Virtual deck</text>
  <text class="m" x="914" y="430">/deck.html · installable PWA</text>
  <text class="s" x="914" y="452">live via SSE · Picture-in-Picture</text>

  <rect class="dash" x="900" y="500" width="320" height="66" rx="4"/>
  <text class="t" x="914" y="521">Shared key renderer</text>
  <text class="m" x="914" y="539">streamdeck/src/cards.ts · src/shared/*</text>
  <text class="n" x="914" y="557">same SVG keys in all three consumers</text>

  <rect class="bx" x="900" y="640" width="320" height="84" rx="4"/>
  <text class="t" x="914" y="662">Host apps</text>
  <text class="s" x="914" y="684">Terminal · IntelliJ IDEA</text>
  <text class="s" x="914" y="704">Claude · ChatGPT / Codex</text>

  <path class="arA" d="M840,550 H880 V185"/>
  <path class="arA" d="M880,185 H898" marker-end="url(#ahA)"/>
  <path class="arA" d="M880,330 H898" marker-end="url(#ahA)"/>
  <path class="arA" d="M880,430 H898" marker-end="url(#ahA)"/>
  <text class="labA" transform="translate(872 470) rotate(-90)" text-anchor="middle">snapshots + SSE</text>

  <path class="ar" d="M840,682 H898" marker-end="url(#ah)"/>
  <text class="lab" x="869" y="674" text-anchor="middle">activate</text>
</svg>
